name: Build Android APK with C Backend

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile C and Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev libbz2-dev liblzma-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b

      - name: Compile C Backend to Android Shared Library (.so)
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang \
            -shared -fPIC -O2 -o libcrypting.so crypting1.c

      - name: Prepare Entry Point for Buildozer
        run: |
          if [ -f "Frontend.py" ] && [ ! -f "main.py" ]; then
            cp Frontend.py main.py
          fi

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: CipherApp-Android-APK
          path: bin/*.apk
